<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ものぐさ手帳 v2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#151515;--surface2:#1e1e1e;--surface3:#282828;
  --text:#d4d4d4;--text2:#888;--accent:#c8a44e;--accent2:#a0833a;
  --red:#c05050;--green:#50a060;--blue:#5080b0;--purple:#8868a8;
  --border:#2a2a2a;--radius:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Helvetica Neue',sans-serif;font-size:14px;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;
  background:none;color:var(--text);-webkit-appearance:none}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--text);
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}

#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto}
header{padding:10px 14px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:15px;font-weight:600;letter-spacing:0.5px;color:var(--accent);flex-shrink:0}
.header-spacer{flex:1}
#yearSelect{width:80px;padding:4px 6px;font-size:13px;text-align:center;background:var(--surface);flex-shrink:0}
#syncBtn{font-size:11px;padding:4px 10px;border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--border);flex-shrink:0;white-space:nowrap}
#syncBtn:active{background:var(--surface3)}
#syncBtn.synced{border-color:var(--green);color:var(--green)}

#viewTabs{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.vtab{flex:1;padding:10px 6px;font-size:12px;font-weight:500;text-align:center;
  color:var(--text2);border-bottom:2px solid transparent;transition:all 0.2s;min-width:0;white-space:nowrap}
.vtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.vtab:active{background:var(--surface)}

#content{flex:1;overflow-y:auto;padding:10px 14px;-webkit-overflow-scrolling:touch}
.entry{background:var(--surface);border-radius:var(--radius);padding:10px 12px;
  margin-bottom:8px;border-left:3px solid var(--border)}
.entry.m-kakeibo{border-left-color:var(--green)}
.entry.m-memo{border-left-color:var(--blue)}
.entry.m-person{border-left-color:var(--purple)}
.entry.m-novel{border-left-color:var(--accent)}
.entry-date{font-size:11px;color:var(--text2);margin-bottom:4px}
.entry-meta{font-size:12px;color:var(--accent2);margin-bottom:4px;font-weight:500}
.entry-body{white-space:pre-wrap;word-break:break-all}
.entry-amount{font-weight:600;font-size:15px}
.entry-amount.income{color:var(--green)}
.entry-amount.expense{color:var(--red)}

.group-header{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0 4px;
  margin-top:8px;border-bottom:1px solid var(--border)}
.group-header:first-child{margin-top:0}
.sub-header{font-size:12px;font-weight:500;color:var(--purple);padding:4px 0 2px;margin-top:6px}

.summary{background:var(--surface2);border-radius:var(--radius);padding:12px;
  margin-top:12px;text-align:center;font-size:15px;font-weight:600}
.summary .plus{color:var(--green)}
.summary .minus{color:var(--red)}
.summary .total{font-size:18px;margin-top:6px}

.person-notes{padding-left:12px;font-size:13px;color:var(--text)}
.person-note-date{font-size:11px;color:var(--text2)}

#inputArea{border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
#modeTabs{display:flex;gap:0}
.mtab{flex:1;padding:8px 4px;font-size:11px;font-weight:600;text-align:center;
  color:var(--text2);border-top:2px solid transparent;transition:all 0.2s}
.mtab.active{border-top-color:var(--green)}
.mtab[data-mode="kakeibo"].active{color:var(--green);border-top-color:var(--green)}
.mtab[data-mode="memo"].active{color:var(--blue);border-top-color:var(--blue)}
.mtab[data-mode="person"].active{color:var(--purple);border-top-color:var(--purple)}
.mtab[data-mode="novel"].active{color:var(--accent);border-top-color:var(--accent)}
.mtab:active{background:var(--surface2)}

#inputForm{padding:10px 14px 14px}
.form-row{display:flex;gap:8px;margin-bottom:8px}
.form-row>*{flex:1}
.form-row .narrow{flex:0 0 100px}
#submitBtn{width:100%;padding:10px;border-radius:var(--radius);font-weight:600;
  font-size:14px;transition:all 0.2s}
#submitBtn:active{transform:scale(0.98)}
.mode-kakeibo #submitBtn{background:var(--green);color:#fff}
.mode-memo #submitBtn{background:var(--blue);color:#fff}
.mode-person #submitBtn{background:var(--purple);color:#fff}
.mode-novel #submitBtn{background:var(--accent);color:#000}

.del-btn{float:right;font-size:11px;color:var(--text2);padding:2px 6px;
  border-radius:3px;background:var(--surface2)}
.del-btn:active{background:var(--red);color:#fff}

.empty{text-align:center;color:var(--text2);padding:40px 20px;font-size:13px}

#status{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:var(--surface3);color:var(--accent);padding:4px 14px;border-radius:20px;
  font-size:11px;opacity:0;transition:opacity 0.3s;z-index:50;pointer-events:none}
#status.show{opacity:1}

.novel-content{white-space:pre-wrap;line-height:1.8;padding:8px 0;font-size:13px}

#syncOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;
  flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
#syncOverlay.show{display:flex}
#syncOverlay h2{color:var(--accent);margin-bottom:16px;font-size:16px}
#syncOverlay p{color:var(--text2);font-size:13px;margin-bottom:20px;text-align:center;max-width:300px}
.sync-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px}
.sync-btns button{padding:12px 24px;border-radius:var(--radius);font-weight:600;font-size:14px}
.sync-btns .primary{background:var(--accent);color:#000}
.sync-btns .secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.sync-btns .danger{background:var(--red);color:#fff;font-size:12px;margin-top:8px}
.sync-btns button:active{opacity:0.8}
</style>
</head>
<body>

<div id="status">保存中...</div>
<div id="syncOverlay">
  <h2>クラウド同期</h2>
  <div id="syncContent"></div>
</div>

<div id="app">
  <header>
    <h1>ものぐさ手帳</h1>
    <div class="header-spacer"></div>
    <select id="yearSelect" onchange="switchYear(this.value)"></select>
    <button id="syncBtn" onclick="openSyncMenu()">ローカル</button>
  </header>

  <div id="viewTabs">
    <button class="vtab active" data-view="all" onclick="switchView('all')">全部</button>
    <button class="vtab" data-view="kakeibo" onclick="switchView('kakeibo')">家計簿</button>
    <button class="vtab" data-view="memo" onclick="switchView('memo')">メモ</button>
    <button class="vtab" data-view="person" onclick="switchView('person')">人物</button>
    <button class="vtab" data-view="novel" onclick="switchView('novel')">小説</button>
  </div>

  <div id="content"></div>

  <div id="inputArea" class="mode-kakeibo">
    <div id="modeTabs">
      <button class="mtab active" data-mode="kakeibo" onclick="switchMode('kakeibo')">家計簿</button>
      <button class="mtab" data-mode="memo" onclick="switchMode('memo')">メモ</button>
      <button class="mtab" data-mode="person" onclick="switchMode('person')">人物</button>
      <button class="mtab" data-mode="novel" onclick="switchMode('novel')">小説</button>
    </div>
    <div id="inputForm"></div>
  </div>
</div>

<script>
// ============================================================
// IndexedDB（常に使う、ローカルの基盤）
// ============================================================
const DB_NAME = 'monogusa-v2';
const DB_VER = 1;
let idb = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('entries')) {
        const store = d.createObjectStore('entries', {keyPath:'id'});
        store.createIndex('year','year',{unique:false});
        store.createIndex('mode','mode',{unique:false});
      }
    };
    req.onsuccess = e => { idb = e.target.result; resolve(idb); };
    req.onerror = e => reject(e);
  });
}

function idbAll(year) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction('entries','readonly');
    const idx = tx.objectStore('entries').index('year');
    const req = idx.getAll(year);
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e);
  });
}

function idbPut(entry) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction('entries','readwrite');
    tx.objectStore('entries').put(entry);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function idbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = idb.transaction('entries','readwrite');
    tx.objectStore('entries').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

// ============================================================
// Firebase（オプション、ログイン時のみ有効化）
// ============================================================
let firebaseReady = false;
let fb_auth = null;
let fb_db = null;
let uid = null;
let unsub = null;

// ★★★ ここにFirebase設定を入れる ★★★
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "000000000000",
  appId: "YOUR_APP_ID"
};

function tryInitFirebase() {
  if (firebaseReady || typeof firebase === 'undefined') return;
  try {
    firebase.initializeApp(firebaseConfig);
    fb_auth = firebase.auth();
    fb_db = firebase.firestore();
    fb_db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    firebaseReady = true;
    fb_auth.onAuthStateChanged(user => {
      if (user) {
        uid = user.uid;
        updateSyncBtn(true);
        startFirebaseSync();
      } else {
        uid = null;
        if (unsub) { unsub(); unsub = null; }
        updateSyncBtn(false);
      }
    });
  } catch(e) { console.warn('Firebase init failed:', e); }
}

function fbSignIn() {
  tryInitFirebase();
  if (!fb_auth) { showStatus('Firebase未設定'); return; }
  fb_auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
    showStatus('ログイン失敗');
    console.error(e);
  });
}

function fbSignOut() {
  if (fb_auth) fb_auth.signOut();
  uid = null;
  if (unsub) { unsub(); unsub = null; }
  updateSyncBtn(false);
  closeSyncMenu();
  showStatus('ログアウトしました');
}

function getCol() {
  return fb_db.collection('users').doc(uid).collection(currentYear);
}

function startFirebaseSync() {
  if (!uid || !fb_db) return;
  if (unsub) unsub();

  // Firestoreのリアルタイムリスナー → ローカルに反映
  unsub = getCol().orderBy('created_at','desc').onSnapshot(async snap => {
    const fbEntries = snap.docs.map(d => {
      const data = {id:d.id, ...d.data(), _synced:true, year:currentYear};
      if (data.created_at?.toMillis) data.created_at = data.created_at.toMillis();
      if (data.updated_at?.toMillis) data.updated_at = data.updated_at.toMillis();
      return data;
    });
    for (const fe of fbEntries) await idbPut(fe);
    await loadFromLocal();
  });

  // ローカル未同期 → Firebase
  pushLocalToFirebase();
}

async function pushLocalToFirebase() {
  if (!uid || !fb_db) return;
  const local = await idbAll(currentYear);
  for (const e of local) {
    if (!e._synced) {
      const data = {...e};
      delete data.id; delete data.year; delete data._synced;
      data.created_at = firebase.firestore.Timestamp.fromMillis(data.created_at || Date.now());
      data.updated_at = firebase.firestore.Timestamp.fromMillis(data.updated_at || Date.now());
      try {
        await getCol().doc(e.id).set(data);
        e._synced = true;
        await idbPut(e);
      } catch(err) { console.warn('Push failed:', err); }
    }
  }
}

async function fbDeleteDoc(id) {
  if (uid && fb_db) {
    try { await getCol().doc(id).delete(); } catch(e) { console.warn(e); }
  }
}

// ============================================================
// App State
// ============================================================
let currentYear = new Date().getFullYear().toString();
let currentMode = 'kakeibo';
let currentView = 'all';
let entries = [];
let saveTimer = null;
let isReadOnly = false;

async function initApp() {
  await openIDB();
  setupYears();
  switchMode(currentMode);
  await loadFromLocal();
  // Firebase SDK遅延読み込み後に初期化試行
  setTimeout(() => tryInitFirebase(), 800);
  // 再試行（SDKがまだ読めてない場合）
  setTimeout(() => tryInitFirebase(), 2500);
}

function setupYears() {
  const sel = document.getElementById('yearSelect');
  const now = new Date().getFullYear();
  sel.innerHTML = '';
  for (let y = now; y >= now - 5; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y + '年';
    if (y.toString() === currentYear) opt.selected = true;
    sel.appendChild(opt);
  }
}

function switchYear(y) {
  currentYear = y;
  isReadOnly = y !== new Date().getFullYear().toString();
  document.getElementById('inputArea').style.display = isReadOnly ? 'none' : '';
  loadFromLocal();
  if (uid && fb_db) {
    if (unsub) unsub();
    startFirebaseSync();
  }
}

async function loadFromLocal() {
  entries = await idbAll(currentYear);
  entries.sort((a,b) => (b.created_at||0) - (a.created_at||0));
  renderContent();
}

// ---- CRUD ----
async function addEntry(data) {
  const now = Date.now();
  const entry = { id:genId(), year:currentYear, created_at:now, updated_at:now, _synced:false, ...data };
  await idbPut(entry);

  if (uid && fb_db) {
    scheduleFbSync(entry);
  }
  showStatus('保存しました');
  await loadFromLocal();
}

function scheduleFbSync(entry) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const data = {...entry};
    delete data.id; delete data.year; delete data._synced;
    data.created_at = firebase.firestore.Timestamp.fromMillis(data.created_at || Date.now());
    data.updated_at = firebase.firestore.Timestamp.fromMillis(data.updated_at || Date.now());
    try {
      await getCol().doc(entry.id).set(data);
      entry._synced = true;
      await idbPut(entry);
    } catch(e) { console.warn('Sync failed:', e); }
  }, 3000);
}

async function deleteEntry(id) {
  if (!confirm('削除しますか？')) return;
  await idbDelete(id);
  await fbDeleteDoc(id);
  showStatus('削除しました');
  await loadFromLocal();
}

// ---- Sync UI ----
function updateSyncBtn(loggedIn) {
  const btn = document.getElementById('syncBtn');
  btn.textContent = loggedIn ? '同期中' : 'ローカル';
  btn.classList.toggle('synced', loggedIn);
}

function openSyncMenu() {
  const overlay = document.getElementById('syncOverlay');
  const content = document.getElementById('syncContent');
  if (uid) {
    content.innerHTML = `
      <p>Googleアカウントと同期中</p>
      <div class="sync-btns">
        <button class="secondary" onclick="closeSyncMenu()">閉じる</button>
        <button class="danger" onclick="fbSignOut()">ログアウト</button>
      </div>`;
  } else {
    content.innerHTML = `
      <p>ローカル保存中<br>Googleログインでクラウド同期できます</p>
      <div class="sync-btns">
        <button class="primary" onclick="fbSignIn()">Googleでログイン</button>
        <button class="secondary" onclick="closeSyncMenu()">ローカルのまま</button>
      </div>`;
  }
  overlay.classList.add('show');
}

function closeSyncMenu() {
  document.getElementById('syncOverlay').classList.remove('show');
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

// ---- Mode / View ----
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mtab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('inputArea').className = 'mode-' + mode;
  renderInputForm();
}

function renderInputForm() {
  const form = document.getElementById('inputForm');
  const today = new Date().toISOString().slice(0,10);
  switch(currentMode) {
    case 'kakeibo':
      form.innerHTML = `
        <div class="form-row">
          <select id="inType" class="narrow"><option value="expense">支出</option><option value="income">収入</option></select>
          <input type="number" id="inAmount" placeholder="金額" inputmode="numeric">
        </div>
        <div class="form-row">
          <input type="text" id="inCategory" placeholder="カテゴリ（食費等）">
          <input type="date" id="inDate" value="${today}" class="narrow">
        </div>
        <div class="form-row"><input type="text" id="inNote" placeholder="メモ（任意）"></div>
        <button id="submitBtn" onclick="submitKakeibo()">記録</button>`; break;
    case 'memo':
      form.innerHTML = `
        <div class="form-row"><input type="date" id="inDate" value="${today}"></div>
        <textarea id="inMemo" placeholder="メモを書く" rows="3"></textarea>
        <div style="height:8px"></div>
        <button id="submitBtn" onclick="submitMemo()">メモ</button>`; break;
    case 'person':
      form.innerHTML = `
        <div class="form-row">
          <input type="text" id="inLocation" placeholder="地名（東神奈川等）">
          <input type="text" id="inPerson" placeholder="人物名">
        </div>
        <textarea id="inPersonNote" placeholder="メモ（複数行OK）" rows="2"></textarea>
        <div style="height:8px"></div>
        <button id="submitBtn" onclick="submitPerson()">記録</button>`; break;
    case 'novel':
      form.innerHTML = `
        <div class="form-row">
          <input type="text" id="inTitle" placeholder="タイトル">
          <input type="text" id="inEpisode" placeholder="話数" class="narrow">
        </div>
        <textarea id="inNovelText" placeholder="本文" rows="4"></textarea>
        <div style="height:8px"></div>
        <button id="submitBtn" onclick="submitNovel()">保存</button>`; break;
  }
}

// ---- Submit ----
function submitKakeibo() {
  const amount = parseInt(document.getElementById('inAmount').value);
  if (!amount) return;
  const type = document.getElementById('inType').value;
  addEntry({
    mode:'kakeibo', type,
    amount: type==='expense' ? -Math.abs(amount) : Math.abs(amount),
    category: document.getElementById('inCategory').value || '未分類',
    date: document.getElementById('inDate').value,
    note: document.getElementById('inNote').value
  });
  document.getElementById('inAmount').value = '';
  document.getElementById('inNote').value = '';
  document.getElementById('inCategory').value = '';
}

function submitMemo() {
  const text = document.getElementById('inMemo').value.trim();
  if (!text) return;
  addEntry({mode:'memo', content:text, date:document.getElementById('inDate').value});
  document.getElementById('inMemo').value = '';
}

function submitPerson() {
  const loc = document.getElementById('inLocation').value.trim();
  const person = document.getElementById('inPerson').value.trim();
  const note = document.getElementById('inPersonNote').value.trim();
  if (!loc || !person || !note) return;
  addEntry({mode:'person', location:loc, person, note, date:new Date().toISOString().slice(0,10)});
  document.getElementById('inPersonNote').value = '';
}

function submitNovel() {
  const title = document.getElementById('inTitle').value.trim();
  const episode = document.getElementById('inEpisode').value.trim();
  const content = document.getElementById('inNovelText').value.trim();
  if (!title || !episode) return;
  addEntry({mode:'novel', title, episode, content});
  document.getElementById('inNovelText').value = '';
}

// ---- View ----
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.vtab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  renderContent();
}

function renderContent() {
  const el = document.getElementById('content');
  let filtered = currentView === 'all' ? entries : entries.filter(e => e.mode === currentView);
  if (!filtered.length) { el.innerHTML = '<div class="empty">データなし</div>'; return; }
  switch(currentView) {
    case 'kakeibo': renderKakeibo(el, filtered); break;
    case 'memo': renderMemo(el, filtered); break;
    case 'person': renderPerson(el, filtered); break;
    case 'novel': renderNovel(el, filtered); break;
    default: renderAll(el, filtered);
  }
}

function renderAll(el, items) {
  el.innerHTML = items.map(e => {
    const cls='m-'+e.mode;
    const label={kakeibo:'家計簿',memo:'メモ',person:'人物',novel:'小説'}[e.mode]||'';
    let body='';
    switch(e.mode){
      case 'kakeibo': body=`<span class="entry-amount ${e.amount>=0?'income':'expense'}">${e.amount>=0?'+':''}${e.amount.toLocaleString()}円</span> ${esc(e.category)}${e.note?' - '+esc(e.note):''}`; break;
      case 'memo': body=esc(e.content); break;
      case 'person': body=`【${esc(e.location)}】『${esc(e.person)}』\n${esc(e.note)}`; break;
      case 'novel': body=`【${esc(e.title)}】『${esc(e.episode)}』`; break;
    }
    return `<div class="entry ${cls}">
      ${!isReadOnly?`<button class="del-btn" onclick="deleteEntry('${e.id}')">×</button>`:''}
      <div class="entry-date">${e.date||''} <span style="color:var(--text2)">${label}</span></div>
      <div class="entry-body">${body}</div>
    </div>`;
  }).join('');
}

function renderKakeibo(el, items) {
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let total=0,income=0,expense=0;
  items.forEach(e=>{total+=e.amount;if(e.amount>0)income+=e.amount;else expense+=e.amount;});
  let html=items.map(e=>`
    <div class="entry m-kakeibo">
      ${!isReadOnly?`<button class="del-btn" onclick="deleteEntry('${e.id}')">×</button>`:''}
      <div class="entry-date">${e.date||''}</div>
      <div class="entry-body">
        <span class="entry-amount ${e.amount>=0?'income':'expense'}">${e.amount>=0?'+':''}${e.amount.toLocaleString()}円</span>
        　${esc(e.category)}${e.note?' - '+esc(e.note):''}
      </div>
    </div>`).join('');
  html+=`<div class="summary">
    <span class="plus">+${income.toLocaleString()}円</span>　<span class="minus">${expense.toLocaleString()}円</span>
    <div class="total" style="color:${total>=0?'var(--green)':'var(--red)'}">合計：${total>=0?'+':''}${total.toLocaleString()}円</div>
  </div>`;
  el.innerHTML=html;
}

function renderMemo(el, items) {
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  el.innerHTML=items.map(e=>`
    <div class="entry m-memo">
      ${!isReadOnly?`<button class="del-btn" onclick="deleteEntry('${e.id}')">×</button>`:''}
      <div class="entry-date">${e.date||''}</div>
      <div class="entry-body">${esc(e.content)}</div>
    </div>`).join('');
}

function renderPerson(el, items) {
  const g={};
  items.forEach(e=>{const l=e.location||'未分類';if(!g[l])g[l]={};const p=e.person||'不明';if(!g[l][p])g[l][p]=[];g[l][p].push(e);});
  let html='';
  for(const loc of Object.keys(g).sort()){
    html+=`<div class="group-header">【${esc(loc)}】</div>`;
    for(const person of Object.keys(g[loc]).sort()){
      html+=`<div class="sub-header">『${esc(person)}』</div>`;
      const notes=g[loc][person].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      html+='<div class="person-notes">';
      notes.forEach(e=>{
        html+=`<div style="margin-bottom:4px">
          ${!isReadOnly?`<button class="del-btn" onclick="deleteEntry('${e.id}')">×</button>`:''}
          ${e.date?`<span class="person-note-date">［${e.date}］</span> `:''}${esc(e.note)}
        </div>`;
      });
      html+='</div>';
    }
  }
  el.innerHTML=html||'<div class="empty">データなし</div>';
}

function renderNovel(el, items) {
  const g={};
  items.forEach(e=>{const t=e.title||'無題';if(!g[t])g[t]={};const ep=e.episode||'?';
    if(!g[t][ep])g[t][ep]=e;else if((e.created_at||0)>(g[t][ep].created_at||0))g[t][ep]=e;});
  let html='';
  for(const title of Object.keys(g).sort()){
    html+=`<div class="group-header">【${esc(title)}】</div>`;
    const eps=Object.keys(g[title]).sort((a,b)=>{const na=parseInt(a),nb=parseInt(b);if(!isNaN(na)&&!isNaN(nb))return na-nb;return a.localeCompare(b);});
    for(const ep of eps){
      const e=g[title][ep];
      html+=`<div class="entry m-novel">
        ${!isReadOnly?`<button class="del-btn" onclick="deleteEntry('${e.id}')">×</button>`:''}
        <div class="entry-meta">『${esc(ep)}』</div>
        <div class="novel-content">${esc(e.content||'')}</div>
      </div>`;
    }
  }
  el.innerHTML=html||'<div class="empty">データなし</div>';
}

function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

window.addEventListener('beforeunload',()=>{if(saveTimer)clearTimeout(saveTimer);});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

initApp();
</script>

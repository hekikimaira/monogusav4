<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<title>ものぐさ手帳</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f5f0;--bg2:#fff;--text:#1a1a2e;--text2:#555;--accent:#2563eb;--accent2:#1d4ed8;--border:#d4d4d4;--header-bg:#1a1a2e;--header-text:#f5f5f0;--danger:#dc2626;--success:#16a34a;--input-bg:#fff;--radius:8px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--purple:#7c3aed;--gold:#b8860b}
[data-theme="dark"]{--bg:#0f0f1a;--bg2:#1a1a2e;--text:#e8e8e8;--text2:#aaa;--border:#333;--header-bg:#0a0a14;--input-bg:#1a1a2e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text)}
textarea{resize:vertical}
.header{background:var(--header-bg);color:var(--header-text);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;min-height:44px;position:sticky;top:0;z-index:100}
.header-title{font-size:15px;font-weight:600;letter-spacing:.5px}
.header-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:18px}
.header-btn:hover{background:rgba(255,255,255,.1)}
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:44px;z-index:99}
.tab-btn{flex:1;padding:10px 0 8px;text-align:center;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn svg{display:block;margin:0 auto 3px;width:20px;height:20px}
.tab-content{display:none;flex:1;overflow-y:auto}
.tab-content.active{display:flex;flex-direction:column}
/* Techo */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.month-nav-label{font-size:15px;font-weight:600}
.month-nav-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:16px;font-weight:700}
.month-nav-btn:hover{background:var(--border)}
.text-input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);font-size:14px;outline:none}
.text-input:focus{border-color:var(--accent)}
.text-area{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);font-size:14px;outline:none;min-height:120px;line-height:1.6}
.text-area:focus{border-color:var(--accent)}
.btn{padding:6px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{border:1px solid var(--border);background:var(--bg2)}.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.techo-toolbar{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);background:var(--bg2)}
.techo-day{display:flex;align-items:stretch;border-bottom:1px solid var(--border);min-height:44px}
.techo-date{width:52px;min-width:52px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;border-right:1px solid var(--border);background:var(--bg2)}
.techo-date.today{background:var(--accent);color:#fff}
.techo-date.sunday,.techo-date.holiday{color:var(--danger)}
.techo-date.saturday{color:var(--accent)}
.techo-entries{flex:1;display:flex;flex-direction:column;padding:4px 6px;gap:2px}
.techo-entry{display:flex;align-items:center;gap:4px;min-height:28px}
.techo-main{flex:1;padding:3px 6px;border:none;background:transparent;font-size:13px;border-bottom:1px solid transparent;outline:none;min-width:0}
.techo-main:focus{border-bottom-color:var(--accent)}
.techo-main.commented{color:var(--text2);opacity:.5;font-style:italic;text-decoration:line-through}
.techo-col-btns{display:flex;flex-direction:column;gap:1px;padding:2px}
.techo-col-btn{width:22px;height:22px;font-size:14px;border-radius:4px;color:var(--text2);opacity:.4;display:flex;align-items:center;justify-content:center}
.techo-col-btn:hover{opacity:1;background:var(--border)}
.techo-month-header{position:sticky;top:88px;z-index:10;background:var(--accent);color:#fff;padding:8px 12px;font-size:14px;font-weight:700;letter-spacing:.5px}
/* Notebook */
.nb-subtabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg2)}
.nb-stab{flex:1;padding:8px 4px;font-size:12px;font-weight:600;text-align:center;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s}
.nb-stab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nb-editor-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.nb-editor{flex:1;border:none;outline:none;resize:none;background:var(--input-bg);color:var(--text);font-family:'Menlo','Courier New',monospace;font-size:14px;line-height:1.7;padding:10px 12px;white-space:pre-wrap;word-break:break-all;overflow-y:auto}
.nb-tagbar{display:flex;gap:0;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.nb-tbtn{flex:1;padding:10px 4px;font-size:12px;font-weight:600;text-align:center;color:var(--text2);transition:all .15s}
.nb-tbtn:active{background:var(--bg)}
.nb-parsed{flex:1;overflow-y:auto;padding:10px 12px}
.nb-card{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--accent)}
.nb-card-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px;cursor:pointer;padding:2px 4px;border-radius:4px}
.nb-card-title:active{opacity:.6}
.nb-filter-hint{text-align:center;font-size:11px;color:var(--text2);padding:6px;background:var(--bg2);border-bottom:1px solid var(--border)}
.nb-card-sub{font-size:12px;font-weight:600;color:var(--purple);margin:6px 0 2px;padding-left:4px}
.nb-card-body{white-space:pre-wrap;word-break:break-all;font-size:13px;line-height:1.6;padding-left:4px}
.nb-card-date{font-size:11px;color:var(--text2)}
.nb-empty{text-align:center;color:var(--text2);padding:40px 20px;font-size:13px}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:16px 16px calc(16px + var(--safe-bottom));animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{font-size:24px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.menu-item{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px;width:100%;text-align:left}
.menu-item:hover{background:var(--bg)}.menu-item:last-child{border-bottom:none}
.menu-icon{font-size:18px;width:28px;text-align:center}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--bg2);border-radius:12px;padding:20px;margin:20px;max-width:300px;text-align:center}
.confirm-msg{font-size:14px;margin-bottom:16px;line-height:1.5}
.confirm-btns{display:flex;gap:8px;justify-content:center}
@media(min-width:768px){body{max-width:800px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>
<body>
<div class="header"><div class="header-title">ものぐさ手帳</div><button class="header-btn" onclick="openMenu()">☰</button></div>
<div class="tab-bar">
<button class="tab-btn active" data-tab="techo" onclick="switchTab('techo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>シフト</button>
<button class="tab-btn" data-tab="notebook" onclick="switchTab('notebook')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>手帳</button>
</div>

<!-- シフト -->
<div class="tab-content active" id="tab-techo">
<div class="month-nav"><button class="month-nav-btn" onclick="techoYear(-1)">◀</button><span class="month-nav-label" id="techo-year-label"></span><button class="month-nav-btn" onclick="techoYear(1)">▶</button></div>
<div class="techo-toolbar"><button class="btn btn-primary btn-sm" onclick="openShiftInsert()">シフト挿入</button><button class="btn btn-outline btn-sm" onclick="techoAddCol()">＋列</button><button class="btn btn-outline btn-sm" id="techo-rmcol" style="display:none" onclick="techoRmCol()">−列</button><button class="btn btn-outline btn-sm" onclick="techoScrollToday()">📍今日</button></div>
<div id="techo-body"></div>
</div>

<!-- 手帳 -->
<div class="tab-content" id="tab-notebook">
<div class="month-nav"><button class="month-nav-btn" onclick="nbYear(-1)">◀</button><span class="month-nav-label" id="nb-year-label"></span><button class="month-nav-btn" onclick="nbYear(1)">▶</button></div>
<div class="nb-subtabs">
  <button class="nb-stab active" data-v="edit" onclick="nbView('edit')">編集</button>
  <button class="nb-stab" data-v="list" onclick="nbView('list')">一覧</button>
</div>
<!-- 編集 -->
<div class="nb-editor-wrap" id="nb-edit-wrap">
  <textarea class="nb-editor" id="nb-editor" placeholder="なんでも書ける手帳です&#10;&#10;【カテゴリ名】で分類&#10;『サブ名』でさらに分類&#10;［日付］で日付挿入&#10;&#10;一覧タブでカテゴリ別に表示&#10;タップでフィルタ&#10;&#10;例:&#10;【買い物リスト】&#10;牛乳、卵、パン&#10;【読書メモ】『1冊目』&#10;面白かった"></textarea>
</div>
<!-- 一覧 -->
<div id="nb-list-wrap" style="display:none;flex:1;display:none;flex-direction:column;overflow:hidden">
  <div class="nb-parsed" id="nb-parsed"></div>
</div>
<!-- タグボタン -->
<div class="nb-tagbar" id="nb-tagbar">
  <button class="nb-tbtn" onclick="nbInsertWrap('【','】')">【】</button>
  <button class="nb-tbtn" onclick="nbInsertWrap('『','』')">『』</button>
  <button class="nb-tbtn" onclick="nbInsertDate()">［日付］</button>
</div>
</div>

<!-- メニュー -->
<div class="modal-overlay" id="menu-modal"><div class="modal-sheet"><div class="modal-header"><span class="modal-title">メニュー</span><button class="modal-close" onclick="closeMenu()">×</button></div>
<button class="menu-item" onclick="xExport()"><span class="menu-icon">📤</span>ZIPエクスポート</button>
<button class="menu-item" onclick="xImport()"><span class="menu-icon">📥</span>ZIPインポート</button>
<button class="menu-item" onclick="xDateFix()"><span class="menu-icon">🕐</span>日付修正</button>
<button class="menu-item" onclick="xTheme()"><span class="menu-icon">🎨</span>テーマ変更</button>
<button class="menu-item" onclick="xShiftEdit()"><span class="menu-icon">📋</span>シフトパターン編集</button>
<button class="menu-item" onclick="xFirebase()"><span class="menu-icon">☁️</span>Firebase同期設定</button>
<button class="menu-item" onclick="xSyncLog()"><span class="menu-icon">📊</span>同期ログ</button>
</div></div>
<div class="confirm-overlay" id="cf"><div class="confirm-box"><div class="confirm-msg" id="cf-msg"></div><div class="confirm-btns"><button class="btn btn-outline" onclick="cfNo()">キャンセル</button><button class="btn btn-danger" onclick="cfYes()">OK</button></div></div></div>
<div class="modal-overlay" id="sub-modal"><div class="modal-sheet" id="smc"></div></div>
<input type="file" id="fi" accept=".zip" style="display:none" onchange="xImportFile(event)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DB='monogusa_',sv=(k,v)=>{try{localStorage.setItem(DB+k,JSON.stringify(v))}catch(e){}},ld=(k,d)=>{try{const v=localStorage.getItem(DB+k);return v?JSON.parse(v):d}catch(e){return d}},uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)});
let S={
  techoDays:ld('techoDays',{}),
  shiftPatterns:ld('shiftPatterns',[{uuid:uid(),name:'A',items:[]},{uuid:uid(),name:'B',items:[]},{uuid:uid(),name:'C',items:[]},{uuid:uid(),name:'D',items:[]}]),
  techoColumns:ld('techoColumns',1),
  notebookTexts:ld('notebookTexts',{}),
  settings:ld('settings',{dateCorrection:0,theme:'system'})
};
function ss(keys){if(!keys)keys=Object.keys(S);for(const k of keys)sv(k,S[k]);fbAutoSync();}
let _fbSyncTimer=null,_fbPushing=false;
const SYNC_LOG_MAX=100;
function syncLog(action,detail){const logs=ld('syncLogs',[]);logs.unshift({time:new Date().toISOString(),action,detail});if(logs.length>SYNC_LOG_MAX)logs.length=SYNC_LOG_MAX;sv('syncLogs',logs);}
function dataSize(){return JSON.stringify(S.techoDays).length+JSON.stringify(S.notebookTexts).length}
function fbAutoSync(){if(_fbSyncTimer)clearTimeout(_fbSyncTimer);_fbSyncTimer=setTimeout(()=>{if(window._fbDb&&window._fbUser)fbPushSilent().catch(()=>{})},2000);}
async function fbPushSilent(){if(!window._fbDb||!window._fbUser)return;try{_fbPushing=true;await window._fbDb.collection('users').doc(window._fbUser.uid).set({techoDays:S.techoDays,shiftPatterns:S.shiftPatterns,techoColumns:S.techoColumns,notebookTexts:S.notebookTexts,updatedAt:new Date().toISOString()});sv('lastSyncAt',new Date().toISOString());syncLog('PUSH',`${dataSize()}字`);setTimeout(()=>{_fbPushing=false},500)}catch(e){_fbPushing=false;syncLog('PUSH_ERROR',e.message)}}
function cn(){return new Date(Date.now()+(S.settings.dateCorrection||0))}
function ts(){const d=cn();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dim(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function dow(y,m,d){return new Date(y,m-1,d).getDay()}
const DW=['日','月','火','水','木','金','土'],HL={};
async function lh(y){if(HL[y])return;try{const r=await fetch(`https://holidays-jp.github.io/api/v1/${y}/date.json`);if(r.ok)HL[y]=await r.json()}catch(e){HL[y]={}}}
function ih(ds){const y=ds.split('-')[0];return HL[y]&&HL[y][ds]}
let ct='techo';
function switchTab(t){ct=t;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+t));if(t==='techo')rT();else if(t==='notebook')rNB()}
function openMenu(){document.getElementById('menu-modal').classList.add('open')}
function closeMenu(){document.getElementById('menu-modal').classList.remove('open')}
function osm(h){document.getElementById('smc').innerHTML=h;document.getElementById('sub-modal').classList.add('open')}
function csm(){document.getElementById('sub-modal').classList.remove('open')}
let cfCb=null;
function cf(msg,cb){document.getElementById('cf-msg').textContent=msg;cfCb=cb;document.getElementById('cf').classList.add('open')}
function cfYes(){document.getElementById('cf').classList.remove('open');if(cfCb)cfCb();cfCb=null}
function cfNo(){document.getElementById('cf').classList.remove('open');cfCb=null}

// === TECHO (シフト) ===
let tY=cn().getFullYear();
function techoYear(n){tY+=n;rT()}
function techoScrollToday(){const el=document.querySelector('.techo-date.today');if(el)el.closest('.techo-day').scrollIntoView({block:'center',behavior:'smooth'})}
async function rT(){
  await lh(tY);
  document.getElementById('techo-year-label').textContent=`${tY}年`;
  const cols=S.techoColumns;document.getElementById('techo-rmcol').style.display=cols>1?'':'none';
  const td=ts();let h='';
  for(let m=1;m<=12;m++){
    const ym=`${tY}-${String(m).padStart(2,'0')}`;const days=dim(ym);
    h+=`<div class="techo-month-header" id="month-${m}">${m}月</div>`;
    for(let d=1;d<=days;d++){
      const ds=`${tY}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dw=dow(tY,m,d),it=ds===td,hl=ih(ds);
      let dc='techo-date';if(it)dc+=' today';else if(hl)dc+=' holiday';else if(dw===0)dc+=' sunday';else if(dw===6)dc+=' saturday';
      let dy=S.techoDays[ds];if(!dy)dy={uuid:uid(),date:ds,entries:[]};
      while(dy.entries.length<cols)dy.entries.push({uuid:uid(),main:'',col:dy.entries.length});
      h+=`<div class="techo-day"><div class="${dc}"><span>${d}</span><span style="font-size:10px">${DW[dw]}</span></div><div class="techo-entries">`;
      for(let c=0;c<dy.entries.length;c++){const e=dy.entries[c];const cmt=e.main&&e.main.startsWith('@@')?' commented':'';h+=`<div class="techo-entry" data-date="${ds}" data-col="${c}" data-uuid="${e.uuid}"><input class="techo-main${cmt}" value="${ea(e.main)}" placeholder="..." oninput="tSv(this)"></div>`}
      h+=`</div><div class="techo-col-btns"><button class="techo-col-btn" onclick="tAdd('${ds}')">＋</button>${dy.entries.length>cols?`<button class="techo-col-btn" onclick="tRm('${ds}')">−</button>`:''}</div></div>`;
    }
  }
  document.getElementById('techo-body').innerHTML=h;
  if(tY===cn().getFullYear())setTimeout(()=>techoScrollToday(),100);
}
function tSv(el){const en=el.closest('.techo-entry'),ds=en.dataset.date,col=+en.dataset.col,eu=en.dataset.uuid;let dy=S.techoDays[ds];if(!dy)dy={uuid:uid(),date:ds,entries:[]};while(dy.entries.length<=col)dy.entries.push({uuid:uid(),main:'',col:dy.entries.length});dy.entries[col].main=el.value;dy.entries[col].uuid=eu;S.techoDays[ds]=dy;ss(['techoDays'])}
function techoAddCol(){S.techoColumns++;ss(['techoColumns']);rT()}
function techoRmCol(){if(S.techoColumns<=1)return;cf('最後の列を削除？',()=>{S.techoColumns--;for(const ds in S.techoDays){const d=S.techoDays[ds];if(d.entries.length>S.techoColumns)d.entries.length=S.techoColumns}ss(['techoColumns','techoDays']);rT()})}
function tAdd(ds){let dy=S.techoDays[ds];if(!dy)dy={uuid:uid(),date:ds,entries:[]};dy.entries.push({uuid:uid(),main:'',col:dy.entries.length});S.techoDays[ds]=dy;ss(['techoDays']);rT()}
function tRm(ds){cf('最後の項目を削除？',()=>{let dy=S.techoDays[ds];if(!dy||dy.entries.length<=S.techoColumns)return;dy.entries.pop();S.techoDays[ds]=dy;ss(['techoDays']);rT()})}
function openShiftInsert(){let h=`<div class="modal-header"><span class="modal-title">シフト挿入</span><button class="modal-close" onclick="csm()">×</button></div><div style="padding:8px"><label style="font-size:13px;font-weight:600">パターン</label><select id="sp" class="text-input" style="margin:6px 0;width:100%">`;S.shiftPatterns.forEach((p,i)=>{h+=`<option value="${i}">${p.name} (${p.items.length}項目)</option>`});h+=`</select><label style="font-size:13px;font-weight:600">開始日</label><input type="date" id="sd" class="text-input" style="margin:6px 0;width:100%" value="${ts()}"><label style="font-size:13px;font-weight:600">繰り返し</label><input type="number" id="sr" class="text-input" style="margin:6px 0;width:100%" value="1" min="1" max="100"><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="doSI()">挿入</button></div>`;osm(h)}

function nbInsertWrap(open,close){

// パーサー: 【】=メイン分類, 『』=サブ分類
function nbParse(){
  const text=document.getElementById('nb-editor').value;
  const lines=text.split('\n');
  // {name, subs: [{name, lines:[]}], lines:[]}
  const cats=[];
  let cur=null; // current main cat
  let curSub=null; // current sub

  for(const line of lines){
    const trimmed=line.trim();
    if(!trimmed)continue;

    // 【メイン】『サブ』 同一行
    const bothM=trimmed.match(/^【([^】]+)】『([^』]+)』$/);
    if(bothM){
      cur=findOrCreateCat(cats,bothM[1]);
      curSub={name:bothM[2],lines:[]};
      cur.subs.push(curSub);
      continue;
    }
    // 【メイン】のみ
    const mainM=trimmed.match(/^【([^】]+)】$/);
    if(mainM){
      cur=findOrCreateCat(cats,mainM[1]);
      curSub=null;
      continue;
    }
    // 『サブ』のみ（現在のメインカテゴリの下）
    const subM=trimmed.match(/^『([^』]+)』$/);
    if(subM){
      if(!cur)cur=findOrCreateCat(cats,'未分類');
      curSub={name:subM[1],lines:[]};
      cur.subs.push(curSub);
      continue;
    }
    // 通常行
    if(curSub){curSub.lines.push(trimmed)}
    else if(cur){cur.lines.push(trimmed)}
    else{cur=findOrCreateCat(cats,'未分類');cur.lines.push(trimmed)}
  }
  return cats;
}

function findOrCreateCat(cats,name){
  let c=cats.find(x=>x.name===name);
  if(!c){c={name,subs:[],lines:[]};cats.push(c)}
  return c;
}

function nbRenderList(){
  const cats=nbParse();
  const parsedEl=document.getElementById('nb-parsed');

  if(!cats.length){parsedEl.innerHTML='<div class="nb-empty">データなし</div>';return}

  const filtered=nbFilter?cats.filter(c=>c.name===nbFilter):cats;

  let html='';
  if(nbFilter){
    html+=`<div class="nb-filter-hint">「${es(nbFilter)}」でフィルタ中 — タップで解除</div>`;
  }
  const show=filtered.length?filtered:cats;
  for(const cat of show){
    html+=`<div class="nb-card"><div class="nb-card-title" onclick="nbSetFilter('${ea(cat.name)}')">【${es(cat.name)}】</div>`;
    if(cat.lines.length){
      html+=`<div class="nb-card-body">${cat.lines.map(l=>es(l)).join('\n')}</div>`;
    }
    for(const sub of cat.subs){
      html+=`<div class="nb-card-sub">『${es(sub.name)}』</div>`;
      if(sub.lines.length){
        html+=`<div class="nb-card-body">${sub.lines.map(l=>es(l)).join('\n')}</div>`;
      }
    }
    html+=`</div>`;
  }
  parsedEl.innerHTML=html;
}

function nbSetFilter(name){
  nbFilter=(nbFilter===name)?null:name;
  nbRenderList();
}

async function fbInit(){
  if(window._fbApp)return;
  if(!window.firebase){await lsc('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');await lsc('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js');await lsc('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js')}
  window._fbApp=firebase.initializeApp(FB_CONFIG);window._fbAuth=firebase.auth();window._fbDb=firebase.firestore();
  let _fbUnsub=null;
  window._fbAuth.onAuthStateChanged(async u=>{
    window._fbUser=u||null;
    if(_fbUnsub){_fbUnsub();_fbUnsub=null}
    if(u){
      // 初回マージ
      try{
        const doc=await window._fbDb.collection('users').doc(u.uid).get();
        if(doc.exists){
          const d=doc.data();
          if(d.techoDays)for(const[k,v]of Object.entries(d.techoDays)){if(!S.techoDays[k]||JSON.stringify(S.techoDays[k])!==JSON.stringify(v))S.techoDays[k]=v}
          if(d.notebookTexts)for(const[k,v]of Object.entries(d.notebookTexts)){if(!S.notebookTexts[k])S.notebookTexts[k]=v;else if(S.notebookTexts[k]!==v)S.notebookTexts[k]=v}
          if(d.shiftPatterns)S.shiftPatterns=d.shiftPatterns;
          if(d.techoColumns&&d.techoColumns>S.techoColumns)S.techoColumns=d.techoColumns;
          for(const k of Object.keys(S))sv(k,S[k]);
        }
        await fbPushSilent();
        switchTab(ct);
      }catch(e){syncLog('MERGE_ERROR',e.message)}
      // リアルタイムリスナー
      _fbUnsub=window._fbDb.collection('users').doc(u.uid).onSnapshot(snap=>{
        if(!snap.exists||_fbPushing)return;
        const d=snap.data();let changed=false;
        if(d.techoDays)for(const[k,v]of Object.entries(d.techoDays)){if(JSON.stringify(S.techoDays[k])!==JSON.stringify(v)){S.techoDays[k]=v;changed=true}}
        if(d.notebookTexts)for(const[k,v]of Object.entries(d.notebookTexts)){if(S.notebookTexts[k]!==v){S.notebookTexts[k]=v;changed=true}}
        if(d.shiftPatterns&&JSON.stringify(S.shiftPatterns)!==JSON.stringify(d.shiftPatterns)){S.shiftPatterns=d.shiftPatterns;changed=true}
        if(d.techoColumns&&d.techoColumns!==S.techoColumns){S.techoColumns=d.techoColumns;changed=true}
        if(changed){for(const k of Object.keys(S))sv(k,S[k]);switchTab(ct)}
      });
    }
  });
}

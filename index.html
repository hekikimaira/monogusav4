<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ものぐさ手帳 v2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#151515;--surface2:#1e1e1e;--surface3:#282828;
  --text:#d4d4d4;--text2:#888;--accent:#c8a44e;--accent2:#a0833a;
  --red:#c05050;--green:#50a060;--blue:#5080b0;--purple:#8868a8;
  --border:#2a2a2a;--radius:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Helvetica Neue',sans-serif;font-size:14px;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;
  background:none;color:var(--text);-webkit-appearance:none}
textarea{font-family:'Helvetica Neue',monospace;font-size:14px;color:var(--text);
  background:transparent;border:none;outline:none;width:100%;resize:none;
  line-height:1.7;padding:0}

/* Layout */
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto}

/* Header */
header{padding:10px 14px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:15px;font-weight:600;letter-spacing:0.5px;color:var(--accent);flex-shrink:0}
.hspace{flex:1}
#yearSelect{width:80px;padding:4px 6px;font-size:13px;text-align:center;
  background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);outline:none;flex-shrink:0}
#syncBtn{font-size:11px;padding:4px 10px;border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--border);flex-shrink:0;white-space:nowrap}
#syncBtn:active{background:var(--surface3)}
#syncBtn.synced{border-color:var(--green);color:var(--green)}

/* View tabs (top) - display mode */
#viewTabs{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.vtab{flex:1;padding:9px 4px;font-size:11px;font-weight:500;text-align:center;
  color:var(--text2);border-bottom:2px solid transparent;transition:all 0.15s;
  min-width:0;white-space:nowrap}
.vtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.vtab[data-view="edit"].active{color:var(--text);border-bottom-color:var(--text)}
.vtab[data-view="kakeibo"].active{color:var(--green);border-bottom-color:var(--green)}
.vtab[data-view="memo"].active{color:var(--blue);border-bottom-color:var(--blue)}
.vtab[data-view="person"].active{color:var(--purple);border-bottom-color:var(--purple)}
.vtab[data-view="novel"].active{color:var(--accent);border-bottom-color:var(--accent)}
.vtab:active{background:var(--surface)}

/* Main content area */
#content{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}

/* Editor */
#editor{width:100%;min-height:100%;font-size:14px;line-height:1.7;color:var(--text);
  background:transparent;border:none;outline:none;resize:none;
  font-family:'Menlo','Courier New',monospace;white-space:pre-wrap;word-break:break-all}

/* Tag insert buttons (bottom) */
#tagBar{display:flex;gap:0;border-top:1px solid var(--border);flex-shrink:0;
  background:var(--surface);overflow-x:auto}
.tbtn{flex:1;padding:10px 4px;font-size:11px;font-weight:600;text-align:center;
  color:var(--text2);transition:all 0.15s;white-space:nowrap;position:relative}
.tbtn:active{background:var(--surface2)}
.tbtn[data-tag="kakeibo"]{color:var(--green)}
.tbtn[data-tag="memo"]{color:var(--blue)}
.tbtn[data-tag="person"]{color:var(--purple)}
.tbtn[data-tag="novel"]{color:var(--accent)}
.tbtn[data-tag="date"]{color:var(--text)}

/* Parsed display */
.parsed-section{margin-bottom:12px}
.entry{background:var(--surface);border-radius:var(--radius);padding:10px 12px;
  margin-bottom:6px;border-left:3px solid var(--border)}
.entry.m-kakeibo{border-left-color:var(--green)}
.entry.m-memo{border-left-color:var(--blue)}
.entry.m-person{border-left-color:var(--purple)}
.entry.m-novel{border-left-color:var(--accent)}
.entry-body{white-space:pre-wrap;word-break:break-all}
.entry-amount{font-weight:600;font-size:15px}
.entry-amount.income{color:var(--green)}
.entry-amount.expense{color:var(--red)}

.group-header{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0 4px;
  margin-top:8px;border-bottom:1px solid var(--border)}
.group-header:first-child{margin-top:0}
.sub-header{font-size:12px;font-weight:500;color:var(--purple);padding:4px 0 2px;margin-top:6px}
.person-notes{padding-left:12px;font-size:13px;color:var(--text)}
.person-note-date{font-size:11px;color:var(--text2)}

.summary{background:var(--surface2);border-radius:var(--radius);padding:12px;
  margin-top:12px;text-align:center;font-size:15px;font-weight:600}
.summary .plus{color:var(--green)}
.summary .minus{color:var(--red)}
.summary .total{font-size:18px;margin-top:6px}

.novel-title{font-size:13px;font-weight:600;color:var(--accent);padding:6px 0 2px}
.novel-ep{font-size:12px;color:var(--accent2);font-weight:500;margin-bottom:2px}
.novel-content{white-space:pre-wrap;line-height:1.8;font-size:13px}

.empty{text-align:center;color:var(--text2);padding:40px 20px;font-size:13px}

#status{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:var(--surface3);color:var(--accent);padding:4px 14px;border-radius:20px;
  font-size:11px;opacity:0;transition:opacity 0.3s;z-index:50;pointer-events:none}
#status.show{opacity:1}

/* Sync overlay */
#syncOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;
  flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
#syncOverlay.show{display:flex}
#syncOverlay h2{color:var(--accent);margin-bottom:16px;font-size:16px}
#syncOverlay p{color:var(--text2);font-size:13px;margin-bottom:20px;text-align:center;max-width:300px}
.sync-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px}
.sync-btns button{padding:12px 24px;border-radius:var(--radius);font-weight:600;font-size:14px}
.sync-btns .primary{background:var(--accent);color:#000}
.sync-btns .secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.sync-btns .danger{background:var(--red);color:#fff;font-size:12px;margin-top:8px}
.sync-btns button:active{opacity:0.8}

/* Line count */
#lineInfo{position:absolute;bottom:46px;right:14px;font-size:10px;color:var(--text2);
  pointer-events:none}
</style>
</head>
<body>

<div id="status"></div>
<div id="syncOverlay">
  <h2>クラウド同期</h2>
  <div id="syncContent"></div>
</div>

<div id="app">
  <header>
    <h1>ものぐさ手帳</h1>
    <div class="hspace"></div>
    <select id="yearSelect" onchange="switchYear(this.value)"></select>
    <button id="syncBtn" onclick="openSyncMenu()">ローカル</button>
  </header>

  <!-- 上：表示モード切替 -->
  <div id="viewTabs">
    <button class="vtab active" data-view="edit" onclick="switchView('edit')">編集</button>
    <button class="vtab" data-view="kakeibo" onclick="switchView('kakeibo')">家計簿</button>
    <button class="vtab" data-view="memo" onclick="switchView('memo')">メモ</button>
    <button class="vtab" data-view="person" onclick="switchView('person')">人物</button>
    <button class="vtab" data-view="novel" onclick="switchView('novel')">小説</button>
  </div>

  <!-- メインエリア -->
  <div id="content">
    <textarea id="editor" placeholder="ここに全部書く。下のボタンでタグ挿入。"></textarea>
  </div>

  <span id="lineInfo"></span>

  <!-- 下：タグ挿入ボタン -->
  <div id="tagBar">
    <button class="tbtn" data-tag="kakeibo" onclick="insertTag('/家計簿')">家計簿</button>
    <button class="tbtn" data-tag="date" onclick="insertDate()">日付</button>
    <button class="tbtn" data-tag="memo" onclick="insertTag('/メモ')">メモ</button>
    <button class="tbtn" data-tag="person" onclick="insertTag('/人物')">人物</button>
    <button class="tbtn" data-tag="novel" onclick="insertTag('/小説')">小説</button>
  </div>
</div>

<script>
// ============================================================
// IndexedDB
// ============================================================
const DB_NAME = 'monogusa-v2';
const DB_VER = 1;
let idb = null;

function openIDB() {
  return new Promise((ok, ng) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('texts')) {
        d.createObjectStore('texts', {keyPath:'key'});
      }
    };
    r.onsuccess = e => { idb = e.target.result; ok(); };
    r.onerror = e => ng(e);
  });
}

function idbGet(key) {
  return new Promise((ok, ng) => {
    const tx = idb.transaction('texts','readonly');
    const r = tx.objectStore('texts').get(key);
    r.onsuccess = () => ok(r.result?.value || '');
    r.onerror = e => ng(e);
  });
}

function idbSet(key, value) {
  return new Promise((ok, ng) => {
    const tx = idb.transaction('texts','readwrite');
    tx.objectStore('texts').put({key, value});
    tx.oncomplete = () => ok();
    tx.onerror = e => ng(e);
  });
}

// ============================================================
// Firebase（オプション）
// ============================================================
let firebaseReady = false;
let fb_auth = null;
let fb_db = null;
let uid = null;
let fbUnsub = null;
let suppressFbCallback = false;

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "000000000000",
  appId: "YOUR_APP_ID"
};

function tryInitFirebase() {
  if (firebaseReady || typeof firebase === 'undefined') return;
  try {
    firebase.initializeApp(firebaseConfig);
    fb_auth = firebase.auth();
    fb_db = firebase.firestore();
    fb_db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    firebaseReady = true;
    fb_auth.onAuthStateChanged(user => {
      if (user) { uid = user.uid; updateSyncBtn(true); startFbSync(); }
      else { uid = null; if (fbUnsub){fbUnsub();fbUnsub=null;} updateSyncBtn(false); }
    });
  } catch(e) { console.warn('Firebase:', e); }
}

function fbSignIn() {
  tryInitFirebase();
  if (!fb_auth) { showStatus('Firebase未設定'); return; }
  fb_auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(() => showStatus('ログイン失敗'));
}

function fbSignOut() {
  if (fb_auth) fb_auth.signOut();
  uid = null;
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  updateSyncBtn(false);
  closeSyncMenu();
  showStatus('ログアウト');
}

function fbDocRef() {
  return fb_db.collection('users').doc(uid).collection('monogusa').doc(currentYear);
}

function startFbSync() {
  if (!uid || !fb_db) return;
  if (fbUnsub) fbUnsub();

  // リアルタイムリスナー
  fbUnsub = fbDocRef().onSnapshot(snap => {
    if (suppressFbCallback) return;
    const data = snap.data();
    if (data && data.text !== undefined) {
      const editor = document.getElementById('editor');
      const localText = editor.value;
      // サーバーの方が新しければ反映（コンフリクト時はサーバー優先）
      if (data.updated_at && data.text !== localText) {
        const pos = editor.selectionStart;
        editor.value = data.text;
        editor.selectionStart = editor.selectionEnd = Math.min(pos, data.text.length);
        // ローカルにも保存
        idbSet(currentYear, data.text);
      }
    }
  });

  // ローカルの現在値をpush（初回）
  pushToFb();
}

function pushToFb() {
  if (!uid || !fb_db) return;
  const text = document.getElementById('editor').value;
  suppressFbCallback = true;
  fbDocRef().set({
    text,
    updated_at: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    setTimeout(() => { suppressFbCallback = false; }, 500);
  }).catch(() => { suppressFbCallback = false; });
}

// ============================================================
// App
// ============================================================
let currentYear = new Date().getFullYear().toString();
let currentView = 'edit';
let saveTimer = null;

async function initApp() {
  await openIDB();
  setupYears();
  await loadText();
  setTimeout(() => tryInitFirebase(), 800);
  setTimeout(() => tryInitFirebase(), 2500);
}

function setupYears() {
  const sel = document.getElementById('yearSelect');
  const now = new Date().getFullYear();
  sel.innerHTML = '';
  for (let y = now; y >= now - 5; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y + '年';
    if (y.toString() === currentYear) opt.selected = true;
    sel.appendChild(opt);
  }
}

function switchYear(y) {
  // 現在のを保存してから切り替え
  saveNow();
  currentYear = y;
  loadText();
  if (uid && fb_db) startFbSync();
}

async function loadText() {
  const text = await idbGet(currentYear);
  document.getElementById('editor').value = text;
  if (currentView !== 'edit') renderView();
}

// ---- 保存（デバウンス3秒） ----
function onInput() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveNow(), 3000);
  updateLineInfo();
}

function saveNow() {
  clearTimeout(saveTimer);
  const text = document.getElementById('editor').value;
  idbSet(currentYear, text);
  if (uid && fb_db) pushToFb();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('editor').addEventListener('input', onInput);
});

window.addEventListener('beforeunload', () => saveNow());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveNow();
});

// ---- タグ挿入 ----
function insertTag(tag) {
  const ed = document.getElementById('editor');
  const pos = ed.selectionStart;
  const text = ed.value;
  // カーソル位置が行頭でなければ改行入れる
  const before = text.slice(0, pos);
  const needNL = before.length > 0 && before[before.length - 1] !== '\n';
  const insert = (needNL ? '\n' : '') + tag + '\n';
  ed.value = before + insert + text.slice(pos);
  ed.selectionStart = ed.selectionEnd = pos + insert.length;
  ed.focus();
  onInput();

  // 編集モードに切り替え
  if (currentView !== 'edit') switchView('edit');
}

function insertDate() {
  const ed = document.getElementById('editor');
  const pos = ed.selectionStart;
  const today = '［' + new Date().toISOString().slice(0, 10) + '］';
  const text = ed.value;
  ed.value = text.slice(0, pos) + today + text.slice(pos);
  ed.selectionStart = ed.selectionEnd = pos + today.length;
  ed.focus();
  onInput();

  if (currentView !== 'edit') switchView('edit');
}

function updateLineInfo() {
  const ed = document.getElementById('editor');
  const lines = ed.value.split('\n').length;
  document.getElementById('lineInfo').textContent = lines + '行';
}

// ---- 表示モード ----
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.vtab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === view));

  const content = document.getElementById('content');
  const editor = document.getElementById('editor');
  const tagBar = document.getElementById('tagBar');
  const lineInfo = document.getElementById('lineInfo');

  if (view === 'edit') {
    editor.style.display = '';
    tagBar.style.display = '';
    lineInfo.style.display = '';
    // 既存のparsed表示を消す
    const parsed = content.querySelector('.parsed-view');
    if (parsed) parsed.remove();
    updateLineInfo();
  } else {
    editor.style.display = 'none';
    tagBar.style.display = 'none';
    lineInfo.style.display = 'none';
    renderView();
  }
}

// ============================================================
// パーサー
// ============================================================
function parseText(text) {
  const lines = text.split('\n');
  let currentMode = null;
  const blocks = { kakeibo: [], memo: [], person: [], novel: [] };

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed === '/家計簿') { currentMode = 'kakeibo'; continue; }
    if (trimmed === '/メモ') { currentMode = 'memo'; continue; }
    if (trimmed === '/人物') { currentMode = 'person'; continue; }
    if (trimmed === '/小説') { currentMode = 'novel'; continue; }
    if (!currentMode || trimmed === '') continue;
    blocks[currentMode].push(trimmed);
  }
  return blocks;
}

function renderView() {
  const text = document.getElementById('editor').value;
  const blocks = parseText(text);
  const content = document.getElementById('content');

  // 既存parsed消す
  let parsed = content.querySelector('.parsed-view');
  if (!parsed) {
    parsed = document.createElement('div');
    parsed.className = 'parsed-view';
    content.appendChild(parsed);
  }

  switch(currentView) {
    case 'kakeibo': renderKakeibo(parsed, blocks.kakeibo); break;
    case 'memo': renderMemo(parsed, blocks.memo); break;
    case 'person': renderPerson(parsed, blocks.person); break;
    case 'novel': renderNovel(parsed, blocks.novel); break;
  }
}

// ---- 家計簿表示 ----
// 行フォーマット: +/-金額 カテゴリ メモ  または ［日付］+/-金額 カテゴリ メモ
function renderKakeibo(el, lines) {
  const re = /^(?:［([^\］]*)］\s*)?([+\-]?\d+)\s*(.*)$/;
  let total = 0, income = 0, expense = 0;
  const items = [];

  for (const line of lines) {
    const m = line.match(re);
    if (!m) continue;
    const date = m[1] || '';
    const amount = parseInt(m[2]);
    const rest = m[3] || '';
    const parts = rest.split(/\s+/);
    const category = parts[0] || '';
    const note = parts.slice(1).join(' ');
    total += amount;
    if (amount > 0) income += amount; else expense += amount;
    items.push({date, amount, category, note});
  }

  if (!items.length) { el.innerHTML = '<div class="empty">家計簿データなし</div>'; return; }

  let html = items.map(e => `
    <div class="entry m-kakeibo">
      ${e.date ? `<div style="font-size:11px;color:var(--text2)">${esc(e.date)}</div>` : ''}
      <div class="entry-body">
        <span class="entry-amount ${e.amount>=0?'income':'expense'}">${e.amount>=0?'+':''}${e.amount.toLocaleString()}円</span>
        　${esc(e.category)}${e.note?' - '+esc(e.note):''}
      </div>
    </div>`).join('');

  html += `<div class="summary">
    <span class="plus">+${income.toLocaleString()}円</span>　<span class="minus">${expense.toLocaleString()}円</span>
    <div class="total" style="color:${total>=0?'var(--green)':'var(--red)'}">合計：${total>=0?'+':''}${total.toLocaleString()}円</div>
  </div>`;
  el.innerHTML = html;
}

// ---- メモ表示 ----
// ［日付］で区切り、日付降順
function renderMemo(el, lines) {
  const entries = [];
  let currentDate = '';
  let buf = [];

  for (const line of lines) {
    const dm = line.match(/^［([^\］]*)］(.*)$/);
    if (dm) {
      if (buf.length) entries.push({date:currentDate, text:buf.join('\n')});
      currentDate = dm[1];
      const rest = dm[2].trim();
      buf = rest ? [rest] : [];
    } else {
      buf.push(line);
    }
  }
  if (buf.length) entries.push({date:currentDate, text:buf.join('\n')});

  if (!entries.length) { el.innerHTML = '<div class="empty">メモなし</div>'; return; }

  entries.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  el.innerHTML = entries.map(e => `
    <div class="entry m-memo">
      ${e.date ? `<div style="font-size:11px;color:var(--text2)">［${esc(e.date)}］</div>` : ''}
      <div class="entry-body">${esc(e.text)}</div>
    </div>`).join('');
}

// ---- 人物表示 ----
// 【地名】で大カテゴリ、名前@メモ で蓄積、［日付］があればその順
function renderPerson(el, lines) {
  const groups = {}; // {location: {person: [{date,note}]}}
  let currentLoc = '';

  for (const line of lines) {
    const locM = line.match(/^【([^】]*)】$/);
    if (locM) { currentLoc = locM[1]; continue; }
    if (!currentLoc) continue;

    // ［日付］名前@メモ or 名前@メモ
    let date = '';
    let rest = line;
    const dateM = rest.match(/^［([^\］]*)］\s*(.*)/);
    if (dateM) { date = dateM[1]; rest = dateM[2]; }

    const atIdx = rest.indexOf('@');
    if (atIdx < 1) continue;
    const person = rest.slice(0, atIdx);
    const note = rest.slice(atIdx + 1);

    if (!groups[currentLoc]) groups[currentLoc] = {};
    if (!groups[currentLoc][person]) groups[currentLoc][person] = [];
    groups[currentLoc][person].push({date, note});
  }

  if (!Object.keys(groups).length) { el.innerHTML = '<div class="empty">人物データなし</div>'; return; }

  let html = '';
  for (const loc of Object.keys(groups).sort()) {
    html += `<div class="group-header">【${esc(loc)}】</div>`;
    for (const person of Object.keys(groups[loc]).sort()) {
      html += `<div class="sub-header">${esc(person)}</div>`;
      const notes = groups[loc][person].sort((a,b) => (a.date||'').localeCompare(b.date||''));
      html += '<div class="person-notes">';
      notes.forEach(n => {
        html += `<div style="margin-bottom:3px">${n.date?`<span class="person-note-date">［${esc(n.date)}］</span> `:''}${esc(n.note)}</div>`;
      });
      html += '</div>';
    }
  }
  el.innerHTML = html;
}

// ---- 小説表示 ----
// 【タイトル】で大カテゴリ、『話数』でサブ、以降が本文
function renderNovel(el, lines) {
  const groups = {}; // {title: {episode: text}}
  let currentTitle = '';
  let currentEp = '';
  let buf = [];

  function flush() {
    if (currentTitle && currentEp) {
      if (!groups[currentTitle]) groups[currentTitle] = {};
      groups[currentTitle][currentEp] = buf.join('\n');
    }
    buf = [];
  }

  for (const line of lines) {
    const titleM = line.match(/^【([^】]*)】$/);
    if (titleM) { flush(); currentTitle = titleM[1]; currentEp = ''; continue; }
    const epM = line.match(/^『([^』]*)』$/);
    if (epM) { flush(); currentEp = epM[1]; continue; }

    // 同一行に両方: 【タイトル】『話数』
    const bothM = line.match(/^【([^】]*)】『([^』]*)』$/);
    if (bothM) { flush(); currentTitle = bothM[1]; currentEp = bothM[2]; continue; }

    if (currentTitle && currentEp) buf.push(line);
  }
  flush();

  if (!Object.keys(groups).length) { el.innerHTML = '<div class="empty">小説データなし</div>'; return; }

  let html = '';
  for (const title of Object.keys(groups).sort()) {
    html += `<div class="group-header">【${esc(title)}】</div>`;
    const eps = Object.keys(groups[title]).sort((a,b) => {
      const na=parseInt(a),nb=parseInt(b);
      if(!isNaN(na)&&!isNaN(nb)) return na-nb;
      return a.localeCompare(b);
    });
    for (const ep of eps) {
      html += `<div class="entry m-novel">
        <div class="novel-ep">『${esc(ep)}』</div>
        <div class="novel-content">${esc(groups[title][ep])}</div>
      </div>`;
    }
  }
  el.innerHTML = html;
}

// ============================================================
// Util
// ============================================================
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

function updateSyncBtn(on) {
  const btn = document.getElementById('syncBtn');
  btn.textContent = on ? '同期中' : 'ローカル';
  btn.classList.toggle('synced', on);
}

function openSyncMenu() {
  const ov = document.getElementById('syncOverlay');
  const c = document.getElementById('syncContent');
  if (uid) {
    c.innerHTML = `<p>Googleアカウントと同期中</p>
      <div class="sync-btns">
        <button class="secondary" onclick="closeSyncMenu()">閉じる</button>
        <button class="danger" onclick="fbSignOut()">ログアウト</button>
      </div>`;
  } else {
    c.innerHTML = `<p>ローカル保存中<br>Googleログインで同期できます</p>
      <div class="sync-btns">
        <button class="primary" onclick="fbSignIn()">Googleでログイン</button>
        <button class="secondary" onclick="closeSyncMenu()">ローカルのまま</button>
      </div>`;
  }
  ov.classList.add('show');
}
function closeSyncMenu() {
  document.getElementById('syncOverlay').classList.remove('show');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
